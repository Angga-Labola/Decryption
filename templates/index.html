<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Decryption</title>
</head>

<body style="background-color: #000000; color: #73613c;">

<nav style="
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.3); /* Dark charcoal with transparency */
    backdrop-filter: blur(10px); /* Glassmorphism blur effect */
    padding: 1rem 5%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3); /* Subtle light border */
    position: sticky;
    top: 0;
    z-index: 1000;">
        
        <ul style="
        list-style: none;
        display: flex;
        gap: 2rem;">
            <a href="https://angga-labola.github.io/index.html"
                style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Home</a>
            <a href="https://angga-labola.github.io/creeds.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Creeds</a>
            <a href="https://angga-labola.github.io/articles.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Articles</a>
            <a href="https://angga-labola.github.io/apps.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Apps</a>
        </ul>
        
</nav>

    <h2>Decryption</h2>
    <p>Enter text to decrypt:</p>
    <form method="POST">
        <textarea type="text" id="text" name="text" step="any" required
        style="width: 100%;
         max-width: 600px;      
         height: 200px;    
         box-sizing: border-box;"></textarea>
        <br><br>
        <button type="submit"
        style=" 
        display: inline-block;
        padding: 10px 20px;
        background-color: #3E5641;
        color : white;
        text-decoration: none;
        border-radius: 5px;
        text-align: center;">
        Submit
        </button>
    </form>

    {% if result is not none %}
        <p id="output-text">
                {{ result }}
        </p>
    {% endif %}
    
    <br><br>
    <!-- Copy Button -->
    <button onclick="copyOutput()"
    style=" 
        display: inline-block;
        padding: 10px 20px;
        background-color: #3E5641;
        color : white;
        text-decoration: none;
        border-radius: 5px;
        text-align: center;">
        Copy Output
    </button>
    <span id="copy-status" style="margin-left: 10px; color: green;"></span>
    <script>
        function copyOutput() {
            // Get the text content from the output element
            const textToCopy = document.getElementById('output-text').innerText;

            // Use the Clipboard API to copy the text
            navigator.clipboard.writeText(textToCopy).then(() => {
                const status = document.getElementById('copy-status');
                status.innerText = 'Copied!';
                setTimeout(() => { status.innerText = ''; }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>

</body>
</html>
